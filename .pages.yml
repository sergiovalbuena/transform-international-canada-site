  - name: giving
    label: Gift levels and Donate page
    type: file
    path: src/content/settings/giving.json
    format: json
    operations: *a1
    fields:
      - name: levels
        label: Suggested gifts
        type: object
        description: Each suggested amount, with what it pays for. Gifts for the same program are shown from smallest to largest.
        fields:
          - name: published
            label: Show this gift
            type: boolean
            description: Untick to hide it everywhere without deleting it.
          - name: amount
            label: Amount ($)
            type: number
            description: Leave empty only while the amount isn’t confirmed, and untick “Show this gift” until then.
          - name: title
            label: Title
            type: string
            description: e.g. One woman’s complete training
          - name: text
            label: What it does
            type: text
          - name: project
            label: Program
            type: select
            options:
              values:
                - value: thars
                  label: Street Business School
                - value: rwanda-risings-progress
                  label: Rwanda Rising
                - value: streams
                  label: STREAMS
                - value: india-ohet
                  label: Open Hands India
                - value: youth-trades
                  label: Youth Trades
                - value: rdp-pads-program
                  label: Youth Menstrual Hygiene
                - value: malawi-chc-sbs
                  label: Community Health Clubs + SBS
          - name: showOn
            label: Where it appears
            type: select
            description: Choose none to hide it everywhere.
            options:
              values:
                - value: home
                  label: Home page (“Your gift, put to work”)
                - value: donate
                  label: Donate page (on the program’s card)
                - value: program
                  label: The program’s own page
              multiple: true
        list:
          collapsible:
            collapsed: true
            summary: ${fields.amount} · {fields.title}
      - name: page
        label: Donate page text
        type: object
        fields:
          - name: heading
            label: Big heading
            type: string
            description: Put *single asterisks* around a word or two to show them in the accent colour.
          - name: intro
            label: Introduction
            type: text
          - name: programsHeading
            label: Programs heading
            type: string
            description: Put *single asterisks* around a word or two to show them in the accent colour.
          - name: programsText
            label: Programs text
            type: text
          - name: generalProgramsHeading
            label: Heading over programs without their own form
            type: string
          - name: formHeading
            label: General donation form heading
            type: string
          - name: formText
            label: General donation form text
            type: text
          - name: formInstruction
            label: Instruction above the form
            type: text
          - name: otherHeading
            label: “Other ways to give” heading
            type: string
          - name: volunteer
            label: “Volunteer or fundraise” text
            type: text
          - name: title
            label: Page title
            type: string
            description: Shown in the browser tab and in search results.
          - name: description
            label: Search results summary
            type: text
      - name: securities
        label: Gifts of stock and securities
        type: object
        fields:
          - name: heading
            label: Heading
            type: string
            description: Put *single asterisks* around a word or two to show them in the accent colour.
          - name: text
            label: Paragraphs
            type: text
            description: One box per paragraph.
            list: true
          - name: points
            label: Ticked points
            type: text
            description: e.g. the year-end deadline. Check the date each year.
            list: true
          - name: heroLink
            label: Link at the top of the Donate page
            type: string
          - name: cardText
            label: Text in “Other ways to give”
            type: text
      - name: taxReceipt
        label: Tax receipt sentence
        type: text
      - name: zeffyNote
        label: About Zeffy (long)
        type: text
      - name: zeffyShortNote
        label: About Zeffy (short)
        type: text
        description: Shown under the gift cards on the home page.
      - name: eTransfer
        label: e-Transfer text
        type: text
      - name: legacy
        label: Legacy gifts text
        type: text
      - name: generalZeffyUrl
        label: General Zeffy form address
        type: string
        description: Only change this if TIC creates a new general Zeffy form.
      - name: generalZeffyEmbedUrl
        label: General Zeffy form address (embedded)
        type: string
        description: Usually the same as above.

# Pages CMS configuration (https://pagescms.org/docs/configuration/).
# GENERATED by scripts/pages-config.mjs — edit that script, not this file, then run
#   node scripts/pages-config.mjs && node scripts/pages-config.mjs --check

settings:
  content:
    merge: true
  commit:
    identity: app
media:
  - name: photos
    label: Photos
    input: src/assets/photos
    output: photos
    categories:
      - image
    extensions:
      - jpg
      - jpeg
      - png
      - webp
    rename: safe
content:
  - name: stories
    label: Stories
    type: collection
    path: src/content/stories
    format: yaml-frontmatter
    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: false
    operations:
      rename: false
    view:
      fields:
        - title
        - date
      primary: title
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        description: Also becomes the story’s web address, so choose it before saving the first time.
        required: true
      - name: date
        label: Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: dateLabel
        label: Date shown instead
        type: string
        description: Optional. Use when only the month is known, e.g. “October 2026”.
      - name: author
        label: Author
        type: string
        description: Optional.
      - name: project
        label: Program
        type: select
        description: Optional. Links the story to a program page.
        options:
          values:
            - value: thars
              label: Street Business School
            - value: rwanda-risings-progress
              label: Rwanda Rising
            - value: streams
              label: STREAMS
            - value: india-ohet
              label: Open Hands India
            - value: youth-trades
              label: Youth Trades
            - value: rdp-pads-program
              label: Youth Menstrual Hygiene
            - value: malawi-chc-sbs
              label: Community Health Clubs + SBS
      - name: excerpt
        label: Short summary
        type: text
        description: One or two sentences for the story cards and search results.
        required: true
      - name: image
        label: Main photo
        type: image
        options:
          media: photos
          path: src/assets/photos/stories
        required: true
      - name: imageAlt
        label: Photo description
        type: string
        description: Describe the photo for people who can’t see it, e.g. “Graduates celebrate at the ceremony in Gitega.”
        required: true
      - name: imageCaption
        label: Photo caption
        type: string
        description: Optional. Shown under the photo.
      - name: body
        label: Story
        type: rich-text
        options:
          format: markdown
          media: false
      - name: gallery
        label: More photos
        type: object
        fields:
          - name: image
            label: Photo
            type: image
            options:
              media: photos
              path: src/assets/photos/stories
          - name: alt
            label: Photo description
            type: string
          - name: caption
            label: Caption
            type: string
          - name: position
            type: string
            hidden: true
        list: true
      - name: imagePosition
        type: string
        hidden: true
      - name: url
        type: string
        hidden: true
